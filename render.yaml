services:
  - type: web
    name: rescuebite-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: ML_API_URL
        fromService:
          type: web
          name: rescuebite-ml
          property: host

  - type: web
    name: rescuebite-ml
    env: python
    buildCommand: pip install -r ml/requirements.txt
    startCommand: uvicorn rescuebite_ml.api:app --app-dir ml/src --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health

